# ByteTrack parameters (Ultralytics format). Tune tracking here.
tracker_type: bytetrack
track_high_thresh: 0.25   # first-stage association threshold
track_low_thresh: 0.1     # second-stage (low-confidence boxes) threshold
new_track_thresh: 0.25    # threshold to start a new track
track_buffer: 30          # how many frames to keep a lost track
match_thresh: 0.8         # matching threshold
fuse_score: True
